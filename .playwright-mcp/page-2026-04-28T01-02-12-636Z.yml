      - paragraph [ref=e99]: Mirrors the shell script’s optional env-var output.
    - generic [ref=e100]:
      - article [ref=e101]:
        - heading "Thread configuration" [level=3] [ref=e102]
        - code [ref=e104]: export INFLUXDB3_NUM_IO_THREADS=3 export INFLUXDB3_DATAFUSION_NUM_THREADS=13
      - article [ref=e105]:
        - heading "Mode and identity" [level=3] [ref=e106]
        - code [ref=e108]: export INFLUXDB3_ENTERPRISE_MODE=all export INFLUXDB3_NODE_IDENTIFIER_PREFIX=<YOUR_NODE_ID> export INFLUXDB3_ENTERPRISE_CLUSTER_ID=<YOUR_CLUSTER_ID>
      - article [ref=e109]:
        - heading "Memory configuration" [level=3] [ref=e110]
        - code [ref=e112]: export INFLUXDB3_EXEC_MEM_POOL_BYTES=70% export INFLUXDB3_PARQUET_MEM_CACHE_SIZE=3GB export INFLUXDB3_FORCE_SNAPSHOT_MEM_THRESHOLD=60%
      - article [ref=e113]:
        - heading "Startup optimization" [level=3] [ref=e114]
        - code [ref=e116]: export INFLUXDB3_CHECKPOINT_INTERVAL=1h export INFLUXDB3_WAL_REPLAY_CONCURRENCY_LIMIT=16
      - article [ref=e117]:
        - heading "Object store" [level=3] [ref=e118]
        - code [ref=e120]: export INFLUXDB3_OBJECT_STORE=file export INFLUXDB3_DB_DIR=/var/lib/influxdb3 export INFLUXDB3_OBJECT_STORE_CONNECTION_LIMIT=32
      - article [ref=e121]:
        - heading "Licensing" [level=3] [ref=e122]
        - code [ref=e124]: export INFLUXDB3_ENTERPRISE_LICENSE_EMAIL=<YOUR_EMAIL>
